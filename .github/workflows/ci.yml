name: CI

# One job, so Gradle is set up and the project configured once rather than for each check. It runs
# for main and pull requests, and from the Actions tab (Run workflow) for any other branch, not on
# every push to every branch. Changes that can't affect the build, such as docs or the on-demand
# workflows, don't run it.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/device-test.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/retrace.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/device-test.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/retrace.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: ./gradlew spotlessCheck
      # Unit tests also generate the Room schema, checked below. The release build is signed with
      # the debug key: it's there to check that R8 builds the app, and the Release workflow signs.
      - name: Unit tests, lint and release build
        run: >-
          ./gradlew --continue
          :core:common:test :core:model:test :core:domain:test testDebugUnitTest
          :app:lintDebug assembleRelease
      - name: Check that the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::The Room schema changed. Commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests
            app/build/reports/lint-results-*
          retention-days: 7
