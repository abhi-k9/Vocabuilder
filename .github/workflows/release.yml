name: Release

# Publishes a GitHub release with the signed APK, either when a version tag such as v1.2.3 is
# pushed, or when run from the Actions tab with a version, which tags the selected branch's latest
# commit. The app's version name and code come from the version.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Versions must look like 1.2.3 (each part 0-99), but got \"$version\"."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::The tag v$version already exists."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - name: Set up release signing
        uses: ./.github/actions/release-signing
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Never publish a release signed with the debug key.
          required: true
      - name: Build the signed release APK
        run: ./gradlew assembleRelease "-Pvocabuilder.versionName=$VERSION"
      - name: Collect the APK, its R8 mapping and checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/Vocabuilder-$VERSION.apk"
          # Needed to read stack traces from this release. Where R8 writes it depends on the Android
          # Gradle plugin version.
          mapping=$(find app/build -name mapping.txt -path "*release*" | sort | head -1)
          cp "$mapping" "dist/Vocabuilder-$VERSION-mapping.txt"
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install **Vocabuilder-$VERSION.apk**; check it against SHA256SUMS.txt if you like.
          The mapping file is only needed to read crash reports."
          # On a manual run, this creates the tag on the commit that was built.
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Vocabuilder $VERSION" \
            --notes "$notes" \
            --generate-notes
